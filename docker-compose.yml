version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: enthesis-db
    environment:
      POSTGRES_USER: enthesis_user
      POSTGRES_PASSWORD: enthesis_pass
      POSTGRES_DB: enthesis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enthesis_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enthesis-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://enthesis_user:enthesis_pass@postgres:5432/enthesis_db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-this}
      - DEBUG=False
      - STORAGE_DIR=/app/storage
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (Optional - for development)
  frontend:
    image: node:18-alpine
    container_name: enthesis-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
